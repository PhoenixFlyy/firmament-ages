# Firmament Ages - wood classes (HW1A, Felix 2026-10-15; dev/decisions-while-away.md "Holz").
#
# Every naturally grown TFC, AFC or Beneath trunk drops the vanilla log of its class; a placed trunk drops itself.
# Vanilla wood can do everything the trees' own wood can: a saw makes planks and the lead species' lumber, it burns
# like the lead species, tans like the class, and the lead species' TFC function blocks take the class tags.
# The species stay for looks: eight class logs or planks around a species sapling make eight of that species.
#
# dev/gen_wood_classes.py reads this table and writes (between generated markers or as whole generated files)
#   kubejs/data/{tfc,afc,beneath}/loot_table/blocks/wood/{log,wood}/<species>.json   T1 drops
#   kubejs/data/firmages/tfc/fuel/<class>_{logs,planks}.json                          T2 fuel (lead species' values)
#   kubejs/data/*/tags/item|block/...                                                  T3/T4 tags
#   kubejs/data/firmages/worldgen/... and kubejs/data/firmages/neoforge/biome_modifier/vanilla_*.json
#                                                                                      vanilla trees in TFC forests
#   the WOOD_CLASSES block of kubejs/startup_scripts/00_constants.js                  read by recipes/age_0/wood_classes.js
# Run: python dev/gen_wood_classes.py  (--check exits 1 if a file is out of date)
#
# Keys per class
#   lead      the species whose lumber, fuel values and function blocks vanilla wood stands in for ("ns:species")
#   species   "ns:species" with planks and lumber of their own
#   variants  AFC variant logs (log, wood and sapling only; their lumber recipe makes the lead of their species)
#   tree      vanilla trees in TFC forests: climate window (TFC forest_entry fields) and the tree features
#   fuel      [duration, temperature, purity] of the lead species' logs; planks burn 2/5 as long, 50 C hotter (TFC rule)

[classes.oak]
lead = "tfc:oak"
species = ["tfc:oak", "tfc:ash", "tfc:maple", "tfc:sycamore", "afc:beech"]
variants = ["afc:black_oak"]
fuel = [2250, 728.0, 1.0]
# temperate, moist: inside the TFC oak window
tree = { min_temperature = 2.0, max_temperature = 16.0, min_groundwater = 220, max_groundwater = 460, min_rain_variance = -0.5, max_rain_variance = 0.75, features = ["minecraft:oak", "minecraft:fancy_oak"], sapling = "minecraft:oak_sapling" }

[classes.birch]
lead = "tfc:birch"
species = ["tfc:birch", "tfc:aspen", "afc:eucalyptus", "afc:ginkgo"]
variants = ["afc:poplar", "afc:rainbow_eucalyptus"]
fuel = [1750, 652.0, 0.95]
# cool: inside the TFC birch window
tree = { min_temperature = -8.0, max_temperature = 7.0, min_groundwater = 130, max_groundwater = 350, min_rain_variance = -0.6, max_rain_variance = 0.8, features = ["minecraft:birch"], sapling = "minecraft:birch_sapling" }

[classes.spruce]
lead = "tfc:spruce"
species = ["tfc:spruce", "tfc:pine", "tfc:douglas_fir", "tfc:white_cedar", "tfc:sequoia", "afc:cypress", "afc:araucaria"]
variants = ["afc:redcedar", "afc:kauri"]
fuel = [1500, 608.0, 0.6]
# cold: TFC spruce and pine country
tree = { min_temperature = -15.0, max_temperature = -2.0, min_groundwater = 150, max_groundwater = 500, min_rain_variance = -1.0, max_rain_variance = 1.0, features = ["minecraft:spruce", "minecraft:pine"], sapling = "minecraft:spruce_sapling" }

[classes.jungle]
lead = "afc:teak"
species = ["tfc:kapok", "tfc:palm", "afc:teak", "afc:hevea", "afc:tualang", "afc:mahoe"]
variants = []
fuel = [1750, 720.0, 0.95]
# hot and wet: the TFC kapok window
tree = { min_temperature = 20.0, max_temperature = 40.0, min_groundwater = 320, max_groundwater = 500, min_rain_variance = -0.55, max_rain_variance = 0.55, features = ["minecraft:jungle_tree_no_vine"], sapling = "minecraft:jungle_sapling" }

[classes.acacia]
lead = "tfc:acacia"
species = ["tfc:acacia", "afc:baobab"]
variants = ["afc:gum_arabic"]
fuel = [1000, 650.0, 0.95]
# hot and dry: savanna next to TFC acacia
tree = { min_temperature = 14.0, max_temperature = 40.0, min_groundwater = 90, max_groundwater = 260, min_rain_variance = 0.4, max_rain_variance = 0.85, features = ["minecraft:acacia"], sapling = "minecraft:acacia_sapling" }

[classes.dark_oak]
lead = "tfc:hickory"
species = ["tfc:blackwood", "tfc:hickory", "tfc:chestnut", "afc:ironwood", "afc:ipe"]
variants = []
fuel = [2000, 762.0, 0.8]
# temperate and dense: the wet half of the TFC hickory window
tree = { min_temperature = 7.0, max_temperature = 17.0, min_groundwater = 330, max_groundwater = 500, min_rain_variance = -0.4, max_rain_variance = 0.6, features = ["minecraft:dark_oak"], sapling = "minecraft:dark_oak_sapling" }

[classes.mangrove]
lead = "tfc:mangrove"
species = ["tfc:mangrove", "tfc:willow", "afc:mahogany"]
variants = []
fuel = [1000, 655.0, 0.95]
# warm salt marsh only (the TFC mangrove forest); the vanilla tree without bee nest and vines
tree = { min_temperature = 16.0, max_temperature = 40.0, min_groundwater = 200, max_groundwater = 500, min_rain_variance = -1.0, max_rain_variance = 1.0, features = ["firmages:vanilla_tree/mangrove"], sapling = "minecraft:mangrove_propagule", forest = "mangrove" }

[classes.cherry]
lead = "afc:fig"
species = ["tfc:rosewood", "afc:fig"]
variants = ["afc:rubber_fig"]
fuel = [1900, 715.0, 0.95]
# mild temperate: warm, moist, little seasonal rain swing
tree = { min_temperature = 10.0, max_temperature = 18.0, min_groundwater = 200, max_groundwater = 420, min_rain_variance = -0.3, max_rain_variance = 0.4, features = ["minecraft:cherry"], sapling = "minecraft:cherry_sapling" }

# The Beneath (Arcane Age): its crimson and warped trunks drop the vanilla stems.
[classes.crimson]
lead = "beneath:crimson"
species = ["beneath:crimson"]
variants = []
fuel = [800, 1000.0, 0.6]
nether = true

[classes.warped]
lead = "beneath:warped"
species = ["beneath:warped"]
variants = []
fuel = [800, 1000.0, 0.6]
nether = true

# Golden bamboo and bamboo turn into each other (R8).
[bamboo]
pairs = [["tfc:plant/golden_bamboo", "minecraft:bamboo"], ["tfc:golden_bamboo_block", "minecraft:bamboo_block"]]

# Vanilla trees in TFC forests (Felix 2026-10-16: vanilla trees generate and grow). A second TFC forest feature with
# only the vanilla entries runs after TFC's own forest in every TFC biome that has one; it uses TFC's forest density of
# the chunk and the climate windows above. rarity: one chunk in N gets a vanilla grove.
[worldgen]
rarity = 6
mangrove_rarity = 4

# Species whose logs TFC or AFC list in tfc:tannin_logs (TFC 4.2.11, AFC 2.1.3): their class's vanilla logs tan too.
tannin_species = ["tfc:birch", "tfc:chestnut", "tfc:douglas_fir", "tfc:hickory", "tfc:maple", "tfc:oak", "tfc:sequoia",
                  "afc:cypress", "afc:teak", "afc:eucalyptus", "afc:gum_arabic", "afc:redcedar", "afc:rainbow_eucalyptus",
                  "afc:black_oak"]
