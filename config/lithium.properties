# Firmament Ages - Lithium 0.15.4 overrides (format: https://github.com/CaffeineMC/lithium/wiki/Configuration-File).
# ModernFix already overwrites the same two methods; Lithium skipped its copy and logged a WARN "Method overwrite
# conflict" at every start. Each of these Lithium mixins holds only that one method (javap of the 0.15.4 jar:
# temperature_cache.BiomeMixin = getTemperature, chunk_tickets.SortedArraySetMixin = removeIf), so turning them off
# changes nothing at runtime; ModernFix's versions stay active.
mixin.world.temperature_cache=false
mixin.collections.chunk_tickets=false
