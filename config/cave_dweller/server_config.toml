# Firmament Ages: Cave Dweller ReEvolved 1.4-rc2 (Felix 2026-10-13, H12). One dweller at a time (mod default 3),
# Overworld only (also the mod default; the Twilight Forest and later dimensions stay free of it). It stops with the
# Iron Age: firmages-core, firmages-server.toml [hardship] caveDwellerUntilAge. Keys from pt.gif.cave_dweller.config.ServerConfig
# (Fzzy Config 0.7.7, id cave_dweller:server_config); Fzzy adds every other key with its default on the first start.
version = 0

# Deep caves only (0.9.0 review): it hunts players at or below y = 0 (spawnHeight, mod default 40), so the copper and tin
# mining near the surface stays free of it.

[spawnConditions]
maximumAmount = 1
spawnHeight = 0
dimensionWhitelist = ["minecraft:overworld"]
