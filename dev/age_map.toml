# ------------------------------------------------------------------------------------------------ recipes
# Grid-recipe lock per recipe namespace ("mod:<ns>" in [recipes].locked_ids of that stage). Default: the
# namespace's [mods] Age, but never earlier than age_0: nothing but the TFC whitelist is craftable in Dawn
# (Doc 08 section 9.2). A recipe whose RESULT is locked is blocked by the item lock anyway; the namespace
# lock catches recipes of a later mod that make earlier items (Firmalife food, Mystical Agriculture essence).
[recipes]
tfc = "generated"                # [dawn_whitelist] below: every other TFC grid recipe needs age_0
minecraft = "age_0"
afc = "age_0"                    # AFC planks, slabs, signs: like the TFC wood recipes
everycomp = "age_0"              # the age_0 items of [items] (db/, mcb/) need their grid recipes in the Stone Age
supplementaries = "age_0"        # timber frames, daub, rope; the item locks hold the Bronze Age rest
firmasupps = "age_0"             # FirmaSupplementaries' TFC recipes (rope from jute fiber)
decorative_blocks = "age_0"      # wood classes (HW1A): the vanilla-wood camp blocks of [items] are Stone Age like db/
mcwbridges = "age_0"             # wood classes (HW1A): the vanilla-wood bridges of [items] are Stone Age like mcb/

# ------------------------------------------------------------------------------------------------ dawn whitelist
# Dawn crafting whitelist (Doc 08 section 9.2: "TFC workbench recipes except shafting and string").
