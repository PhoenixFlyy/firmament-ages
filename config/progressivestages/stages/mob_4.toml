# Firmament Ages - mob ladder stage "mob_4" (Industrial Age spawns).
# Granted together with age_4 by kubejs/server_scripts/stages/grants.js.
# DEVIATION (see dev/poc-checklist.md, open point): Doc 08 wants mob_N non-cumulative (mob_(N-1) revoked).
# ProgressiveStages locks an entry while its stage is MISSING, so revoking mob_1 at the Iron Age would
# re-lock skeletons and re-enable the creeper replacement. grants.js therefore keeps the ladder cumulative
# (FA.MOB_LADDER_CUMULATIVE = true); flip it only if a later rung needs to remove mobs again.

[stage]
id = "mob_4"
display_name = "Mob Tier 4"
description = "Spawns of the Industrial Age."
icon = "minecraft:zombie_head"
category = "Mob Ladder"
tags = ["mob"]
hidden = true

# Industrial: + Apotheosis affix mobs, stronger nights (Apotheosis world tier, not a spawn rule).
