# Firmament Ages - stage "age_4" = Age 4: Industrial Age.
# DRAFT beyond the PoC scope (Dawn to Iron Age): mod-wide locks and dimension locks from Doc 08 v3.
# POC: every mod id below is unverified (derived from mod names) unless noted; a wrong id matches nothing.
# Blocks between ">>> generated" and "<<< generated" are rewritten by dev/gen_stage_locks.py.

[stage]
id = "age_4"
display_name = "Age 4: Industrial Age"
description = "Coke, heavy steel, the first FE and Create packages."
icon = "minecraft:blast_furnace"
unlock_message = "&6&lAge 4: Industrial Age &r&7- a new chapter opens."
dependency = "age_3"
category = "Ages"
tags = ["age"]

[items]
locked = [
    # Every item of this Age: one tag, generated from dev/age_map.toml by dev/gen_stage_locks.py
    # (kubejs/data/firmages/tags/item/age_items/). Change Ages in the map, not here.
    # >>> generated:items >>>
    "tag:firmages:age_items/age_4",
    # <<< generated:items <<<
]

[recipes]
# Grid recipes of the namespaces that enter with this Age (dev/age_map.toml [mods] and [recipes]).
# A recipe whose result is locked is also blocked by the item tag above.
locked_ids = [
    # >>> generated:recipes >>>
    "mod:advancedtfctech",
    "mod:aeronautics",
    "mod:cataclysm",
    "mod:create_factory_logistics",
    "mod:create_mechanical_spawner",
    "mod:createaddition",
    "mod:createbigcannons",
    "mod:engineered_schematics",
    "mod:immersiveengineering",
    "mod:immersiveposts",
    "mod:offroad",
    "mod:simulated",
    "mod:tfc_ie_addon",
    # <<< generated:recipes <<<
]

[mobs]
# POC: entity ids unverified.
locked_spawns = [
    "id:cataclysm:netherite_monstrosity",
]

