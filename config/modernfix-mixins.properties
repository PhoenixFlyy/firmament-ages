# Firmament Ages - ModernFix 5.27.26 overrides (format: one "option=true|false" per line, see the file ModernFix writes).
# measure_time logs the start and datapack load times at WARN ("Dedicated server took ...", "Initial datapack load
# took ...") at every start; the pack's tools do not read them and vanilla's "Done (...)" line stays. Turning it off
# removes only those timing mixins (ModernFix.class checks feature.measure_time.ServerLoad, javap).
mixin.feature.measure_time=false
