# Firmament Ages - stage "age_1" = Age 1: Bronze Age (Stone Age goal "Hearthstone" grants it).
# Locked while the team does NOT own age_1. Create enters late in this Age (andesite tier);
# its brass/iron tier is additionally locked in age_2.toml (PS needs every listing stage).
# Blocks between ">>> generated" and "<<< generated" are rewritten by dev/gen_stage_locks.py.

[stage]
id = "age_1"
display_name = "Age 1: Bronze Age"
description = "Anvils, crucibles, three bronzes and the first water wheel."
icon = "firmages:sky_disc"
unlock_message = "&6&lAge 1: Bronze Age &r&7- the first alloys. New veins can be found."
dependency = "age_0"
category = "Ages"
tags = ["age"]

[items]
locked = [
    # Every item of this Age: one tag, generated from dev/age_map.toml by dev/gen_stage_locks.py
    # (kubejs/data/firmages/tags/item/age_items/). Change Ages in the map, not here.
    # >>> generated:items >>>
    "tag:firmages:age_items/age_1",
    # <<< generated:items <<<
]

[recipes]
# Grid recipes of the namespaces that enter with this Age (dev/age_map.toml [mods] and [recipes]).
# A recipe whose result is locked is also blocked by the item tag above.
locked_ids = [
    # >>> generated:recipes >>>
    "mod:c2tfc",
    "mod:create",
    "mod:create_connected",
    "mod:firmalife",
    "mod:precisionprospecting",
    "mod:rnr",
    "mod:sophisticatedbackpacks",
    "mod:sophisticatedcore",
    "mod:tfcastikorcarts",
    "mod:woodencog",
    # <<< generated:recipes <<<
]

[mobs]
# Mowzie's Mobs hang on the cumulative age stages (Doc 08 section 5).
# POC: entity ids from research-raw/r3-misc.md, not checked against the 1.8.2 registry.
locked_spawns = [
    "id:mowziesmobs:grottol",
    "id:mowziesmobs:foliaath",
]

# >>> generated:ore_overrides >>>
