# ------------------------------------------------------------------------------------------------ ore families
# Non-TFC ores that generate as TFC-style veins (grades poor/normal/rich x 21 rocks, plus a small surface
# ore). The Age is the stage in which the ore becomes visible; blocks, ore pieces and powder all get it,
# so a team can mine and stock what it sees (Doc 10 v3 section 8.1). Every family found in the world scan
# (dev/scan_regions.py, 2026-09-30) is listed; TFC's own ores are in [tfc_ores].
[ore_families]
"tfc_ie_addon:galena" = "age_4"          # lead, Industrial Age
"tfc_ie_addon:bauxite" = "age_5"         # aluminium, Electric Age
"tfc_ie_addon:uraninite" = "age_7"       # uranium, disguised until the Space Age
"mekatfc:native_osmium" = "age_5"        # visible from age_5, Mekanism (and the ingot) in age_6
"firmalife:chromite" = "age_4"           # chromium is only used for stainless steel, which needs nickel (age_4)
# A key with {rock} is a single-grade ore block per rock (no poor/normal/rich).
"tfcreate:quartz_{rock}" = "age_2"       # nether quartz from the TFCreate quartz vein, Iron Age (section 8.1)

