#List of dimensions where shaders should not be used.
disabledDimensions = ["ad_astra:earth_orbit", "ad_astra:moon", "ad_astra:moon_orbit", "ad_astra:mars", "ad_astra:mars_orbit", "ad_astra:venus", "ad_astra:venus_orbit", "ad_astra:mercury", "ad_astra:mercury_orbit", "ad_astra:glacio", "ad_astra:glacio_orbit", "firmages:origin"]
#Enable optionally specifying different shader settings per dimension.
enablePerDimensionShaders = true
