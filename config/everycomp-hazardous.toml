# Firmament Ages - Every Compat 2.11.53 conditional registration.
# Every Compat builds furniture, windows, doors, bridges and beams for every wood type Moonlight finds. The pack wants
# them only in TerraFirmaCraft and ArborFirmaCraft woods (34 woods: the Stone to Bronze Age home), so the other wood
# mods of the pack are excluded here and Macaw's window and door styles are pruned (research n2-deco-mods P2).
# This file is conditional REGISTRATION: client and server must carry the same file. packwiz and the CurseForge export
# ship it to both; it is not a player setting. Key names from the 1.21 source (UnsafeDisablerConfigs).
# Entry-set names: "<mod id>:<block id without the wood>" as in everycomp-entries.toml.
# Full file: every key of the mod's spec (defaults where the pack has no opinion), so NeoForge has nothing to
# correct on a fresh install (no "is not correct. Correcting" line, no *.toml.bak). Why the pack sets what it sets:
# the lines above and the comments next to those keys.

[woodtype]
	# Every wood namespace of the pack that is neither tfc nor afc (registry snapshot 0.8.1). Vanilla woods need no
	# entry: the base mods register those themselves.
	#Exclude WoodType from all of Modules
	#    EXAMPLE: blacklist = [
	#        "forestry:.*fireproof.*",		COMMENT: .* is an RegEx, it exclude all of WoodType containing "fireproof" from Forestry
	#        "biomesoplenty:.*",			COMMENT: .* is an RegEx, it exclude all of WoodType from Wood Mod for any Module
	#        "biomesoplenty:redwood"		COMMENT: exclude redwood from Wood Mod for any module
	#    ]
	#
	blacklist = ["twilightforest:.*", "ad_astra:.*", "ars_nouveau:.*", "cataclysm:.*", "occultism:.*", "totemic:.*"]

[entryset]
	# Macaw's Windows: the four-pane and plain pane windows go; 13 of 18 sets stay (window, window2, stripped log and
	# plank windows, plank pane window, parapets, blinds, shutters, curtain rod).
	# Macaw's Doors: 8 of 22 styles stay (barn, barn glass, classic, cottage, glass, stable, stable head, western).
	#Exclude EntrySet from the module for All of WoodType or LeavesType
	#    This is only applied to Wood-Good.
	#    EXAMPLE: blacklist = [
	#        "chipped:checkered_trapdoor",		COMMENT: chipped:checkered_oak_trapdoor without "oak"
	#        "variantvanillablocks:chest",		COMMENT: variantvanillablocks:oak_chest without "oak"
	#        "chipped:.*"						COMMENT: .* is an regex which will exclude all of EntrySets from one Module - Wood-Good ONLY
	#    ]
	#    NOTE: This excluded one entryset from all WoodTypes/LeavesTypes
	#
	blacklist = [
		"mcwwindows:four_window", "mcwwindows:log_four_window", "mcwwindows:stripped_log_four_window",
		"mcwwindows:plank_four_window", "mcwwindows:pane_window", "mcwwindows:stripped_pane_window",
		"mcwdoors:waffle_door", "mcwdoors:bark_glass_door", "mcwdoors:beach_door", "mcwdoors:four_panel_door",
		"mcwdoors:bamboo_door", "mcwdoors:modern_door", "mcwdoors:mystic_door", "mcwdoors:nether_door",
		"mcwdoors:paper_door", "mcwdoors:japanese_door", "mcwdoors:japanese2_door", "mcwdoors:swamp_door",
		"mcwdoors:tropical_door", "mcwdoors:whispering_door"
	]

[module]
	# Twilight Forest's own module (banisters, drying racks, hollow logs per wood) is not wanted in TFC woods.
	#Exclude Module From Wood-Good, Stone-Zone & Gems-Realm
	#    EXAMPLE: blacklist = [
	#        "chipped",
	#        "variantvanillablocks"
	#    ]
	#
	blacklist = ["twilightforest"]

[leavestype]
	#Exclude LeavesType from all of Modules
	#	The example is same as WoodType's
	blacklist = []

[block]
	#Exclude a specific WoodType/LeavesType block
	#    This is only applied to Wood-Good.
	#    EXAMPLE: blacklist = [
	#        "chipped/biomesoplenty/checkered_redwood_trapdoor",	COMMENT: excluded a checkered_trapdoor from Chipped with Biomes-O'-Plenty's redwood
	#        "variantvanillablocks/biomesoplenty/fir_chest",		COMMENT: excluded a chest from Variant-Vanilla-Blocks with Biomes-O'-Plenty's fir
	#        ".*/biomesoplenty/fir_chest",							COMMENT: .* is an RegEx, so it exclude fir_chest from any Supported-Mods with just Biomes-O'-Plenty (Wood-Mods)
	#        "chipped/.*/fir_chest",								COMMENT: .* is an RegEx, so it exclude fir_chest from any Wood-Mods with just chipped (Supported-Mod)
	#        ".*fir_chest",											COMMENT: .* is an RegEx, so it exclude fir_chest from any Supported-Mods & Wood-Mods
	#    ]
	#
	blacklist = []

[other]
	#Disable all of Supported Mods on EveryCompat's side. This feature is same as Library-Section which do not have any Wood Modules.
	#WARNING: If the config between CLIENT & SERVER are not the same, then you won't able to join a server
	include_all_wood_modules = true
