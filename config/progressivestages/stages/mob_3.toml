# Firmament Ages - mob ladder stage "mob_3" (Arcane Age spawns).
# Granted together with age_3 by kubejs/server_scripts/stages/grants.js.
# DEVIATION (confirmed by Felix 2026-10-17, dev/decisions-while-away.md "G1: Mob-Leiter kumulativ"): Doc 08 wants mob_N non-cumulative (mob_(N-1) revoked).
# ProgressiveStages locks an entry while its stage is MISSING, so revoking mob_1 at the Iron Age would
# re-lock skeletons and re-enable the creeper replacement. grants.js therefore keeps the ladder cumulative
# (FA.MOB_LADDER_CUMULATIVE = true); flip it only if a later rung needs to remove mobs again.

[stage]
id = "mob_3"
display_name = "Nights of the Arcane Age"
description = "What walks in the dark of the Arcane Age."
icon = "minecraft:zombie_head"
category = "Mob Ladder"
tags = ["mob"]
hidden = true

# Arcane: + Nether mobs (dimension lock), Ars Wilden (age_3.toml), blood moon (kubejs/server_scripts/firmages/blood_moon.js).
