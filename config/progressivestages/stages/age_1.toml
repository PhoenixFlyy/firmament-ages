# Firmament Ages - stage "age_1" = Age 1: Bronze Age (Stone Age goal "Hearthstone" grants it).
# Locked while the team does NOT own age_1. Create enters late in this Age (andesite tier);
# its brass/iron tier is additionally locked in age_2.toml (PS needs every listing stage).
# Blocks between ">>> generated" and "<<< generated" are rewritten by dev/gen_stage_locks.py.

[stage]
id = "age_1"
display_name = "Age 1: Bronze Age"
description = "Anvils, crucibles, three bronzes and the first water wheel."
icon = "firmages:sky_disc"
unlock_message = "&6&lAge 1: Bronze Age &r&7- the first alloys. New veins can be found."
dependency = "age_0"
category = "Ages"
tags = ["age"]

[items]
locked = [
    # Fire clay (crucible) and leather knapping belong to the Bronze Age.
    "tag:tfc:fire_clay_knapping",
    "tag:tfc:leather_knapping",
