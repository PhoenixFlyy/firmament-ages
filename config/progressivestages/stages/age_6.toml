# Firmament Ages - stage "age_6" = Age 6: Information Age.
# DRAFT beyond the PoC scope (Dawn to Iron Age): mod-wide locks and dimension locks from Doc 08 v3.
# POC: every mod id below is unverified (derived from mod names) unless noted; a wrong id matches nothing.
# Blocks between ">>> generated" and "<<< generated" are rewritten by dev/gen_stage_locks.py.

[stage]
id = "age_6"
display_name = "Information Age"
description = "Ore tripled, one network, the End."
icon = "minecraft:comparator"
dependency = "age_5"
category = "Ages"
tags = ["age"]

[items]
locked = [
    # Every item of this Age: one tag, generated from dev/age_map.toml by dev/gen_stage_locks.py
    # (kubejs/data/firmages/tags/item/age_items/). Change Ages in the map, not here.
    # >>> generated:items >>>
    "tag:firmages:age_items/age_6",
    # <<< generated:items <<<
]

[recipes]
# Grid recipes of the namespaces that enter with this Age (dev/age_map.toml [mods] and [recipes]).
# A recipe whose result is locked is also blocked by the item tag above.
locked_ids = [
    # >>> generated:recipes >>>
    "mod:ae2",
    "mod:ae2wtlib",
    "mod:appmek",
    "mod:bosses_of_mass_destruction",
    "mod:createappliedkinetics",
    "mod:createstockbridge",
    "mod:extendedae",
    "mod:hostilenetworks",
    "mod:igleelib",
    "mod:immersive_paintings",
    "mod:mekanism",
    "mod:mekanism_lasers",
    "mod:mekanismadditions",
    "mod:mekanismgenerators",
    "mod:mekanismtools",
    "mod:mekmm",
    "mod:moremekanismprocessing",
    "mod:mysticalagriculture",
    # <<< generated:recipes <<<
]

[dimensions]
locked = [
    "id:minecraft:the_end",
]

