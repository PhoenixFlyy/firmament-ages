plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Each repo is restricted to the groups it serves, so Gradle does not probe every repo for every artifact.
    maven { name = 'Create'; url = 'https://maven.createmod.net'; content { includeGroup 'com.simibubi.create' } }
    maven { name = 'BlameJared (IE)'; url = 'https://maven.blamejared.com'; content { includeGroup 'blusunrize.immersiveengineering' } }
    maven { name = 'ModMaven (Mekanism)'; url = 'https://modmaven.dev'; content { includeGroup 'mekanism' } }
    maven { name = 'covers1624 (DE, BC, CCL)'; url = 'https://maven.covers1624.net'; content { includeGroup 'com.brandon3055.draconicevolution'; includeGroup 'com.brandon3055.brandonscore'; includeGroup 'io.codechicken' } }
    maven { name = 'klikli-dev (Occultism)'; url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'; content { includeGroup 'com.klikli_dev' } }
    maven { name = 'NeoForged (AE2)'; url = 'https://maven.neoforged.net/releases'; content { includeGroup 'org.appliedenergistics' } }
    maven { name = 'FTB'; url = 'https://maven.ftb.dev/releases'; content { includeGroup 'dev.ftb.mods' } }
    mavenCentral() // JUnit
}

base {
    archivesName = 'firmages-core'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests (SPEC 12, level G): dev-only code and test data, loaded as part of the mod in dev runs, never in the jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.gametest)

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ---- Firmament Ages hook targets --------------------------------------------------------
    // All compileOnly and non-transitive: firmages-core compiles against the exact jars the pack
    // ships, but never bundles or requires them. Every integration must be guarded with
    // ModList.get().isLoaded(...) so the mod also loads when one of them is absent.
    // If code later touches Create types that come from Ponder/Flywheel/Registrate, add those
    // artifacts as compileOnly too (Create's POM lists them).

    // Maven-published mods, pinned to the pack's versions (gradle.properties)
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    compileOnly("blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}") { transitive = false }
    compileOnly("mekanism:Mekanism:${mekanism_version}") { transitive = false }
    compileOnly("mekanism:Mekanism:${mekanism_version}:generators") { transitive = false }
    compileOnly("com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_version}") { transitive = false }
    compileOnly("com.brandon3055.brandonscore:BrandonsCore:${brandonscore_version}") { transitive = false }
    compileOnly("io.codechicken:CodeChickenLib:${ccl_version}") { transitive = false }
    compileOnly("com.klikli_dev:occultism-1.21.1-neoforge:${occultism_version}") { transitive = false }
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }

    // No maven: exact Modrinth jars from the pack, stored in ./libs (see README)
    compileOnly files("libs/progressivestages-${progressivestages_version}.jar")
    compileOnly files("libs/TerraFirmaCraft-NeoForge-1.21.1-${tfc_version}.jar")
    compileOnly files("libs/kubejs-neoforge-${kubejs_version}.jar")
    compileOnly files("libs/rhino-${rhino_version}.jar")
    compileOnly files("libs/modonomicon-1.21.1-neoforge-${modonomicon_version}.jar") // shrine rings, ghost preview
    compileOnly files("libs/Stargate.Journey-1.21.1-${sgjourney_version}.jar") // The Origin return gate (compat/sgjourney)
    compileOnly files("libs/Jade-1.21.1-NeoForge-${jade_version}.jar") // shrine tooltips (compat/jade)

    // Required mods (and KubeJS for the binding) in dev runs: runServer, runGameTestServer
    localRuntime files("libs/progressivestages-${progressivestages_version}.jar")
    localRuntime files("libs/modonomicon-1.21.1-neoforge-${modonomicon_version}.jar")
    localRuntime files("libs/kubejs-neoforge-${kubejs_version}.jar")
    localRuntime files("libs/rhino-${rhino_version}.jar")

    // GameTests also run with IE and Mekanism (self-contained jars), so the typed recipe extractors, the IE TagOutput
    // accessor and the MineralMix mixin run against the real mod classes. Create and Occultism need further mods
    // (Ponder/Flywheel, GeckoLib/SmartBrainLib) and are not in the run.
    gametestRuntimeOnly("blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}") { transitive = false }
    gametestRuntimeOnly("mekanism:Mekanism:${mekanism_version}") { transitive = false }
    // Draconic Evolution (with Brandon's Core and CCL) for the reactor controller and fuel port against a real reactor,
    // Stargate Journey for The Origin's space location and return gate.
    gametestRuntimeOnly("com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_version}") { transitive = false }
    gametestRuntimeOnly("com.brandon3055.brandonscore:BrandonsCore:${brandonscore_version}") { transitive = false }
    gametestRuntimeOnly("io.codechicken:CodeChickenLib:${ccl_version}") { transitive = false }
    gametestRuntimeOnly files("libs/Stargate.Journey-1.21.1-${sgjourney_version}.jar")
    // Jade, so the GameTest server loads the tooltip plugin class (its client half never runs there).
    gametestRuntimeOnly files("libs/Jade-1.21.1-NeoForge-${jade_version}.jar")

    // Unit tests (SPEC 12, level U): pure Java, no Minecraft bootstrap
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1' // the Gson version Minecraft 1.21.1 ships

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// ---- libs/: mods without a maven --------------------------------------------------------
// The exact jars the pack pins in FirmamentAges/mods/<name>.pw.toml are downloaded into libs/
// and checked against the hash in that file (sha1 for CurseForge, sha512 for Modrinth metafiles). libs/*.jar is git-ignored (TFC alone is 65 MB).
// Bump a version by updating the pack; this task follows the .pw.toml automatically.
def packModsDir = file('../../mods')
def libMetafiles = ['progressivestages', 'terrafirmacraft', 'kubejs', 'rhino', 'modonomicon', 'sgjourney', 'jade'].collect { new File(packModsDir, "${it}.pw.toml") }
def libsDir = file('libs')
def fetchLibs = tasks.register('fetchLibs') {
    group = 'firmages'
    description = 'Downloads the pack-pinned jars of mods without a maven into libs/ and verifies their sha512.'
    inputs.files(libMetafiles)
    outputs.dir(libsDir)
    doLast {
        libsDir.mkdirs()
        libMetafiles.each { File meta ->
            def text = meta.getText('UTF-8')
            def field = { String key -> def m = (text =~ /(?m)^${key}\s*=\s*"?([^"\s]+)"?/); m.find() ? m.group(1) : null }
            def filename = field('filename')
            def expected = field('hash')
            def algorithm = [sha1: 'SHA-1', sha256: 'SHA-256', sha512: 'SHA-512'][field('hash-format')]
            // Modrinth metafiles carry the url; CurseForge metafiles (mode metadata:curseforge) only the file id.
            def url = field('url')
            if (url == null && field('file-id') != null) {
                def id = field('file-id') as long
                url = "https://edge.forgecdn.net/files/${id.intdiv(1000)}/${id % 1000}/${URLEncoder.encode(filename, 'UTF-8').replace('+', '%20')}"
            }
            if (filename == null || expected == null || algorithm == null || url == null) throw new GradleException("fetchLibs: cannot read ${meta.name}")
            def target = new File(libsDir, filename)
            def digest = { File f -> java.security.MessageDigest.getInstance(algorithm).digest(f.bytes).encodeHex().toString() }
            if (target.exists() && digest(target) == expected) return
            println "fetchLibs: downloading ${filename}"
            new URL(url).withInputStream { i -> target.withOutputStream { o -> o << i } }
            if (digest(target) != expected) { target.delete(); throw new GradleException("${field('hash-format')} mismatch for ${filename} (from ${meta.name})") }
        }
    }
}
tasks.named('compileJava') { dependsOn fetchLibs }

// The gametest run needs the KubeJS probe script (checks FirmAges.lockedOreBlocks() on the reload path) and the
// pack's own firmages-core hand-off scripts (m1 prospecting and m3 miner blacklist, kubejs/server_scripts/firmages),
// which the GameTests exercise against test tags.
// Every run starts on a fresh world (no mirror, no SavedData), which is the boot path the tests expect.
def cleanGametestWorld = tasks.register('cleanGametestWorld', Delete) {
    delete 'run/gametest/world'
}
def prepareGametestRun = tasks.register('prepareGametestRun', Copy) {
    group = 'firmages'
    dependsOn cleanGametestWorld
    from 'src/gametest/kubejs'
    from('../../kubejs/server_scripts/firmages') { into 'server_scripts/firmages' }
    into 'run/gametest/kubejs'
}
// ProgressiveStages stand-ins of the pack stages the Origin tests need (age_9 dimension lock, finale_won).
def prepareGametestConfig = tasks.register('prepareGametestConfig', Copy) {
    group = 'firmages'
    from 'src/gametest/config'
    into 'run/gametest/config'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareGametestRun, prepareGametestConfig, fetchLibs }

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
