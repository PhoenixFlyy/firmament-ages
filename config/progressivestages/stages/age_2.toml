# Firmament Ages - stage "age_2" = Age 2: Iron Age (Bronze Age goal "Sky Disc" grants it).
# Locked while the team does NOT own age_2. The map (stage ftbchunks_mapping) and Tom's Simple
# Storage (helper stage tool_toms_storage) are granted by kubejs/server_scripts/stages/grants.js.
# Blocks between ">>> generated" and "<<< generated" are rewritten by dev/gen_stage_locks.py.

[stage]
id = "age_2"
display_name = "Age 2: Iron Age"
description = "Bloomery, wrought iron, steel, brass machinery and the first trains."
icon = "firmages:steel_heart"
unlock_message = "&6&lAge 2: Iron Age &r&7- the map opens and iron veins become visible."
dependency = "age_1"
category = "Ages"
tags = ["age"]

[items]
locked = [
    # Every item of this Age: one tag, generated from dev/age_map.toml by dev/gen_stage_locks.py
    # (kubejs/data/firmages/tags/item/age_items/). Change Ages in the map, not here.
    # >>> generated:items >>>
    "tag:firmages:age_items/age_2",
    # <<< generated:items <<<
]

[recipes]
# Grid recipes of the namespaces that enter with this Age (dev/age_map.toml [mods] and [recipes]).
# A recipe whose result is locked is also blocked by the item tag above.
locked_ids = [
    # >>> generated:recipes >>>
    "mod:bellsandwhistles",
    "mod:bits_n_bobs",
    "mod:copycats",
    "mod:create_mechanical_extruder",
    "mod:create_pattern_schematics",
    "mod:createcasing",
    "mod:createdeco",
    "mod:createframed",
    "mod:createrailwaysnavigator",
    "mod:dndecor",
    "mod:gateways",
    "mod:railways",
    "mod:tfcbetterbf",
    "mod:tfcreate",
    "mod:toms_storage",
    "mod:twilightforest",
    # <<< generated:recipes <<<
]

[dimensions]
locked = [
    "id:twilightforest:twilight_forest",
]

[mobs]
# POC: Mowzie ids from research-raw/r3-misc.md. The Ferrous Wroughtnaut is a structure boss and is
# NOT spawn-locked (it would be gone forever); lock its drops here once the item ids are known.
locked_spawns = [
    "id:mowziesmobs:naga",
]

