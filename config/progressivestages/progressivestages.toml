# Firmament Ages - ProgressiveStages 3.0.5 main config (only the keys the pack changes or pins).
# Key names verified against StageConfig.java at tag v3.0.5 (github.com/MCEnvision/ProgressiveStages).
# NeoForge fills every key that is missing here with its default and rewrites the file on first start.
# Stage definitions live in config/progressivestages/stages/*.toml.

[general]
	# Dawn is the caveman prologue; mob_0 is the first rung of the mob ladder.
	starting_stages = ["dawn", "mob_0"]
	# One FTB Teams party for the whole server = one shared progression.
	team_mode = "ftb_teams"
	# Granting a stage with missing dependencies fails (admin /stage grant asks twice).
	linear_progression = false

[team]
	# Keep stages on the player record if someone leaves the party by accident.
	persist_stages_on_leave = true

[enforcement]
	# Locked items render as "Unknown Item".
	mask_locked_item_names = true
	# Immersion: no "This item is locked!" chat lines (the lock sound and the tooltips stay).
	show_lock_message = false
	# No "creative bypasses locks" chat warning for ops.
	show_creative_bypass_popup = false

[client]
	# No second "progression map" button next to the recipe book; FTB Quests (K) is the only progress screen.
	show_inventory_button = false

[messages]
	# No mod name in command output.
	prefix = ""
	# Lock texts in the voice of the pack (defaults: red bold "Item Locked" with a lock emoji, "Progress further to
	# unlock."). The three tooltip_*_locked texts must stay different from each other: firmages-core's locked-tooltip
	# trim (LockedTooltip) builds Set.of() from them, and Set.of throws on duplicates. tooltip_stage_required reaches
	# operators only (enforcement.reveal_stage_names_only_to_operators stays at its default, true).
	tooltip_masked_name = "&7Something Unknown"
	tooltip_item_and_recipe_locked = "&8Not of this Age, nor its making"
	tooltip_item_locked = "&8Not of this Age"
	tooltip_recipe_locked = "&8Its making belongs to a later Age"
	tooltip_stage_required = "&7Opens with &f{stage}"
	tooltip_stage_required_generic = "&8Its Age has not come."
	item_locked_generic = "&7Not yet. Its Age has not come."
	type_locked_generic = "&7Not yet. Its Age has not come."
	items_dropped = "&7{count} things fall from your pack. Their Age has not come."
	items_moved_hotbar = "&7{count} things slip from your hands into your pack. Their Age has not come."

[jei]
	# JEI runs only as EMI's plugin backend, but it must hide locked content too (PoC item "EMI + JEI").
	enabled = true

[emi]
	enabled = true
	# Locked items and recipes disappear from EMI completely until the Age is reached.
	show_locked_recipes = false

[integration.ftbteams]
	enabled = true

[integration.ftbquests]
	enabled = true
