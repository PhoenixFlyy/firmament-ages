# TabTPS display configuration
#
#    Available modules: [tps, mspt, memory, ping, cpu, players]
#    Modules are configured in comma separated format, i.e. "cpu,tps,mspt", "ping", or "" (no modules)
#
# Firmament Ages (G3, Felix T1A 2026-10-18): a quiet tab-list footer with ping, TPS, MSPT and memory; no header,
# no coordinates; action bar and boss bar stay off unless a player turns them on (/tabtps).

action-bar-settings {
    allow=true
    enable-on-login=false
    modules="tps,mspt,ping"
    separator=" <gray>|</gray> "
    theme=default
}
boss-bar-settings {
    allow=true
    enable-on-login=false
    modules="tps,mspt,ping"
    separator=" <gray>|</gray> "
    theme=default
}
permission="tabtps.defaultdisplay"
tab-settings {
    allow=true
    enable-on-login=true
    footer-modules="ping,tps,mspt,memory"
    header-modules=""
    separator=" <dark_gray>|</dark_gray> "
    theme=default
}
