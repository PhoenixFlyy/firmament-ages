# Regular expressions (full match on the item id), same effect as the ids above.
patterns = [
    # Wood classes (HW1A, dev/wood_classes.toml): the vanilla-wood originals of the deco mods follow style parity
    # ([hidden.parity] below) instead of the n7 pattern. Every Compat's TFC oak and mangrove copies are pixel-identical
    # to the vanilla originals (planks and log), so they go; the other TFC and AFC woods differ and stay.
    "everycomp:[a-z_]+/tfc/(.+_)?(oak|mangrove)(_.+)?",
    # Create Encased's vanilla-wood shafts, cogwheels and casings: TFC wood has none of them (parity).
    "createcasing:(.*_)?(oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|bamboo|crimson|warped)(_.*)?",
    # Astikor Carts Redux's vanilla-wood carts: TFC Astikor Carts builds every cart in TFC and AFC woods.
    "astikorcartsredux:(.*_)?(oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|bamboo|crimson|warped)(_.*)?",
    # Rechiseled's own 3,600 vanilla-material blocks: the chisel screen only shows the pack's TFC rock groups.
    "rechiseled:(?!chisel$).+",
    # Macaw's Trapdoors prints of the styles Every Compat does not build (config/everycomp-hazardous.toml).
    "mcwtrpdoors:print_(bamboo|beach|blossom|classic|mystic|paper|swamp|tropical|whispering)",
    # Deco round C1, Bibliocraft Legacy (vorauswahl.md, Auflage): seats, tables, shelves, lamps and lanterns, clocks,
    # fancy armor stands, the tool rack and the sword pedestal are locked (the pack has them already); kept are the
    # display case, label, clipboard, stockroom catalog, bookcase, typewriter, printing table and the small parts.
    "bibliocraft:.*_seat(_back)?",
    "bibliocraft:(?!(iron_)?printing_table$).*_table",
    "bibliocraft:.*_shelf",
    "bibliocraft:.*(_lamp|_lantern)",
    "bibliocraft:.*_clock",
    "bibliocraft:.*fancy_armor_stand",
    "bibliocraft:.*_tool_rack",
    "bibliocraft:sword_pedestal",
]

# Style parity of the vanilla-wood originals (wood classes HW1A, Felix 2026-10-15/16): vanilla wood is Stone Age wood
# from every felled tree, so a deco mod's vanilla-wood item is visible at its own Age exactly when Every Compat builds
# the same style in TFC wood (everycomp:<module>/tfc/<id path with the wood word replaced by oak>); styles TFC wood does
# not get stay hidden. Module "": no Every Compat module, every vanilla-wood item hidden. Bibliocraft's display case has
# no Every Compat module (16 colours per wood): the oak display cases stay and take any wooden slab (recipes/deco_c1.js).
[hidden.parity]
woods = "dark_oak|oak|spruce|birch|jungle|acacia|mangrove|cherry|bamboo|crimson|warped"
keep = "bibliocraft:(white|orange|magenta|light_blue|yellow|lime|pink|gray|light_gray|cyan|purple|blue|brown|green|red|black)_oak_display_case"
mods = { mcwfurnitures = "mcfur", handcrafted = "hc", mcwwindows = "mcw", mcwdoors = "mcd", mcwstairs = "mws", another_furniture = "af", mcwroofs = "mcr", storagedrawers = "sd", mcwfences = "mcf", mcwtrpdoors = "mct", mcwbridges = "mcb", decorative_blocks = "db", bibliocraft = "bcl", create = "c", dustydecorations = "" }

