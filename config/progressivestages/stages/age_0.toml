# Firmament Ages - stage "age_0" = Age 0: Stone Age (Dawn goal "The First Spark" grants it).
# Everything listed here is locked while the team does NOT own age_0, i.e. during Dawn.
# Blocks between ">>> generated" and "<<< generated" are rewritten by dev/gen_stage_locks.py;
# edit the generator's tables, not those lines.

[stage]
id = "age_0"
display_name = "Age 0: Stone Age"
description = "Clay, pit kilns and the first cast copper."
icon = "firmages:hearthstone"
unlock_message = "&6&lAge 0: Stone Age &r&7- fire tamed. Clay and copper await."
dependency = "dawn"
category = "Ages"
tags = ["age"]

