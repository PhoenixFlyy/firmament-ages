groups = ["stone"]               # tfc:crafting/stone/<tool>/<rock category> = stone tool assembly
singles = [
    "firestarter", "thatch", "straw", "straw_from_alfalfa", "straw_from_canola", "straw_from_hay",
    "stick_bundle", "stick_from_bunch", "stick_from_bundle", "stick_from_tfc_bamboo",
