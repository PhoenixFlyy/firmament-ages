# Firmament Ages - TerraFirmaCraft 4.2.11 server config defaults (copied into new worlds' serverconfig).
# Key path verified in ServerConfig.java at tag v4.2.11: builder "mechanics" -> "vanillaChanges".
# Food decay, stack windows and tool durability stay at TFC defaults on purpose (decision r7, Doc 08 section 12).

[general]
	# Default []. TFC infers the ingot-pile metal of an item from every c:ingots/<metal> and c:double_ingots/<metal>
	# tag (net.dries007.tfc.util.MetalItem$MetalPartCache). The wrought iron ingot sits in c:ingots/iron and
	# c:ingots/wrought_iron, "iron" won, and TFC 4.2.11 has no iron pile texture. Excluding the two iron tags leaves
	# wrought_iron (log: "was inferred to match multiple metals iron and wrought_iron", fb3 server log triage C).
	inferredMetals = ["ingots/iron", "double_ingots/iron"]

[mechanics]
	[mechanics.vanillaChanges]
		# Default false. The Dawn nights need surface monsters; ProgressiveStages mob_N stages subtract again.
		enableVanillaMonstersOnSurface = true

[blocks]
	[blocks.torch]
		# H3 (Felix 2026-10-13): torches burn out after 43200 ticks (36 real minutes, about 43 TFC hours) instead of 86400.
		# fireStarterChance stays at TFC's file value 0.25: TFC 4.2.11 reads the firestarter AND flint and pyrite
		# from that one key (defined twice), so raising it would make both easier, not harder.
		torchTicks = 43200

	[blocks.snow]
		# Default 80 (vanilla 16). n7-world (2026-10-14): snow piles up twice as fast, so winters look and walk
		# different; the melt rate is snowMeltMultiplier (3) times the accumulation rate, so spring thaw doubles too.
		ticksPerSnowAccumulation = 40
