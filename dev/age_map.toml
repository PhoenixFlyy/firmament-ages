# ------------------------------------------------------------------------------------------------ ore families
# Non-TFC ores that generate as TFC-style veins (grades poor/normal/rich x 21 rocks, plus a small surface
# ore). The Age is the stage in which the ore becomes visible; blocks, ore pieces and powder all get it,
# so a team can mine and stock what it sees (Doc 10 v3 section 8.1). Every family found in the world scan
# (dev/scan_regions.py, 2026-09-30) is listed; TFC's own ores are in [tfc_ores].
[ore_families]
"tfc_ie_addon:galena" = "age_4"          # lead, Industrial Age
"tfc_ie_addon:bauxite" = "age_5"         # aluminium, Electric Age
"tfc_ie_addon:uraninite" = "age_7"       # uranium, disguised until the Space Age
"firmages:native_osmium" = "age_5"       # the pack vein (startup_scripts/osmium.js), visible from age_5; the ingot is age_6
"firmages:draconium" = "age_7"           # the pack vein (startup_scripts/draconium.js), deep in igneous intrusive rock
"firmalife:chromite" = "age_4"           # chromium is only used for stainless steel, which needs nickel (age_4)
# A key with {rock} is a single-grade ore block per rock (no poor/normal/rich).
"tfcreate:quartz_{rock}" = "age_2"       # nether quartz from the TFCreate quartz vein, Iron Age (section 8.1)
"firmages:ore/inferium/{rock}" = "age_6"    # Mystical Agriculture veins (startup_scripts/mystical_veins.js, decision
"firmages:ore/prosperity/{rock}" = "age_6"  # 8A): MA's own ore generation is off, hidden until the Information Age

# A pack vein that places a mod's own block in ONE host rock: the block is disguised as that rock until its Age.
[ore_blocks]
"mysticalagriculture:soulstone" = { stage = "age_6", rock = "basalt" }     # the soulstone vein (decision 8A)
"mysticalagriculture:soulium_ore" = { stage = "age_6", rock = "basalt" }   # 5 % of the soulstone vein, as in MA
# Starfall (firmages-core SPEC 24.5, 25.4): crater blocks outside the rock layers look like sky rock and drop it until
# their Age (key disguise = a block id instead of rock); OreGuard stops machines on them until then.
"firmages:meteorite" = { stage = "age_2", disguise = "firmages:sky_rock" }
"firmages:starfall_core" = { stage = "age_2", disguise = "firmages:sky_rock" }
"firmages:starsteel_meteorite" = { stage = "age_5", disguise = "firmages:sky_rock" }
# Drifting Isles (firmages-core SPEC 24.5, 30.4): the crystal blocks look like skystone and drop it until the Industrial
# Age; OreGuard stops machines on them until then. The clusters keep their light, so the isles glow from the ground.
"firmages:firmament_crystal_cluster" = { stage = "age_4", disguise = "firmages:skystone" }
"firmages:firmament_lode" = { stage = "age_4", disguise = "firmages:skystone" }

