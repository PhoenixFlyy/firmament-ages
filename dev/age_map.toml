# Firmament Ages - Age map: the ONE source for "which Age does this item, block or grid recipe belong to".
#
# dev/gen_stage_locks.py reads this file plus the registry snapshot dev/data/registry.json and writes
#   - kubejs/data/firmages/tags/item/age_items/<stage>.json   every item in exactly one tag (its Age)
#   - kubejs/data/firmages/tags/block/age_blocks/<stage>.json  ore and deposit blocks per Age
#   - the generated blocks of config/progressivestages/stages/*.toml: "tag:firmages:age_items/<stage>" as the
#     item lock, "mod:<ns>" grid-recipe locks, the Dawn crafting selectors and the [[ores.overrides]] rows.
# The same tags feed the firmages-core recipe filter later (mod/firmages-core/SPEC.md section 2.1).
#
# How an item gets its Age (first rule that applies wins):
#   1. listed in config/progressivestages/stages/disabled.toml  -> tag age_items/disabled (never unlocked)
#   2. [items] "id:<item>"                                        -> that Age (may be EARLIER than the mod Age)
#   3. [items] "name:<text>" / "tag:<item tag>" / "mod:<ns>", in file order
#   4. [ore_families] and the TFC tables ([tfc_ores], [tfc_metals], [tfc_powders]): ore pieces, ore blocks,
#      metal items (derived from dev/data/tfc-4.2.11-ids.json and the registry)
#   5. max([mods] Age of the namespace, Age of every [materials] word in the item path)
#      ("decoration of a metal or tech mod belongs to the Age of its materials", Doc 10 v3 section 8.1)
# A namespace that is missing from [mods] makes the generator fail, so a new mod cannot slip through unmapped.
#
# Stages: dawn, age_0 .. age_9. Sources: Doc 10 v3 section 1 (Age column), section 6 (stations), section 8.1
# (material canon); Doc 08 v3 sections 2 and 9.2.

# ------------------------------------------------------------------------------------------------ mods
# Age slot per namespace (Doc 10 v3 section 1). A range "a-b" in the doc starts at a; later items of that
# mod are pulled up by [materials] words or [items] rules. Libraries and QoL mods without an Age column
# take the Age of what they are made from.
[mods]
minecraft = "dawn"               # vanilla world items; metals and gems follow [materials]
tfc = "dawn"                     # world, food, knapping; metals, ores, gems via the TFC tables
afc = "dawn"                     # ArborFirmaCraft trees are world content (0+); its grid recipes follow TFC ([recipes])
