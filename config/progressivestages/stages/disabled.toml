# Firmament Ages - sink stage "disabled" (SevTech pattern). It is NEVER granted, so everything listed
# here is permanently locked: unusable, not pickable, hidden in EMI/JEI. It backs up the static
# unification in kubejs/server_scripts (recipe removal + c:hidden_from_recipe_viewers, Doc 10 v3 section 7).
# Scope of this draft: everything that exists by the Industrial Age. Never grant this stage, not even to admins:
# `/stage bulk grant` and `/stage tag grant` would include it, so it carries no tags.

[stage]
id = "disabled"
display_name = "Disabled"
description = "Removed from Firmament Ages."
icon = "minecraft:barrier"
category = "Helpers"
hidden = true

[items]
locked = [
    # Create: TFC zinc and TFC brass are canonical; Create plates are replaced by TFC sheets.
    # Ids checked against Create 6.0.10 lang/en_us.json. Zinc, copper and brass NUGGETS stay (Doc 10 v3 section 8.1).
