# Firmament Ages - mob ladder stage "mob_2" (Iron Age spawns).
# Granted together with age_2 by kubejs/server_scripts/stages/grants.js.
# DEVIATION (confirmed by Felix 2026-10-17, dev/decisions-while-away.md "G1: Mob-Leiter kumulativ"): Doc 08 wants mob_N non-cumulative (mob_(N-1) revoked).
# ProgressiveStages locks an entry while its stage is MISSING, so revoking mob_1 at the Iron Age would
# re-lock skeletons and re-enable the creeper replacement. grants.js therefore keeps the ladder cumulative
# (FA.MOB_LADDER_CUMULATIVE = true); flip it only if a later rung needs to remove mobs again.

[stage]
id = "mob_2"
display_name = "Nights of the Iron Age"
description = "What walks in the dark of the Iron Age."
icon = "minecraft:zombie_head"
category = "Mob Ladder"
tags = ["mob"]
hidden = true

# Iron: + witches, phantoms, slimes. Twilight Forest mobs are gated by the dimension lock in age_2.
[mobs]
locked_spawns = [
    # G3 (Felix O1A): Alex's Mobs sea species (hunters)
    "id:alexsmobs:hammerhead_shark",
    "id:alexsmobs:frilled_shark",
    "id:alexsmobs:giant_squid",
    "id:minecraft:witch",
    "id:minecraft:phantom",
    "id:minecraft:slime",
]
